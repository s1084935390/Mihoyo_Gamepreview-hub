<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>前瞻总结 · 玩星铁的绳匠</title>
<style>
  /* ========== 全局 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #06080f;
    --line: rgba(255, 255, 255, 0.06);
    --txt: #e6e9f5;
    --txt-dim: #8e98b5;
    --gold: #fbbf24;
    --radius: 24px;
    --radius-sm: 16px;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif;
    color: var(--txt);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ========== 背景光效 ========== */
  .bg-glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 50% 40% at 15% 0%, rgba(124, 110, 255, 0.16), transparent 65%),
      radial-gradient(ellipse 45% 40% at 85% 10%, rgba(60, 160, 255, 0.13), transparent 65%),
      radial-gradient(ellipse 60% 50% at 50% 100%, rgba(255, 120, 200, 0.07), transparent 65%);
  }
  .bg-glow::after {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 30px 30px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 15%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 15%, transparent 70%);
  }

  /* ========== 页面容器 ========== */
  .app {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.6rem 1.2rem 4rem;
  }

  @media (max-width: 640px) {
    .app { padding: 1rem 0.7rem 3rem; }
  }

  /* ========== 顶部导航 ========== */
  .top-nav {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.8rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--line);
  }
  .top-nav .logo {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    background: linear-gradient(120deg, #c9e4ff, #a0c0ff, #d9b8ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
    cursor: pointer;
  }
  .top-nav .spacer { flex: 1; }
  .top-nav .author-chip {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.35rem 0.9rem 0.35rem 0.45rem;
    border-radius: 40px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    text-decoration: none;
    color: var(--txt-dim);
    font-size: 0.8rem;
    font-weight: 500;
    transition: all .2s;
    flex-shrink: 0;
  }
  .top-nav .author-chip:hover {
    background: rgba(255,255,255,0.07);
    border-color: rgba(160,190,255,0.25);
    color: #cfe0ff;
  }
  .author-chip img, .author-chip .avatar-fallback {
    width: 26px; height: 26px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,0.1);
    background: linear-gradient(135deg, #a78bfa, #60a5fa);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; font-weight: 800; color: #fff;
  }

  /* ========== 视图切换 ========== */
  .view { display: none; animation: fadeUp .35s ease both; }
  .view.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ========== 首页 游戏卡片 ========== */
  .home-hero {
    text-align: center;
    margin-bottom: 2.2rem;
  }
  .home-hero h1 {
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(120deg, #e8f0ff 10%, #a9c4ff 45%, #c4a8ff 80%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
  }
  .home-hero p {
    font-size: 0.9rem;
    color: var(--txt-dim);
  }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.1rem;
  }
  @media (max-width: 820px) { .game-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .game-grid { grid-template-columns: 1fr; } }

  .game-card {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.02);
    cursor: pointer;
    transition: transform .28s ease, border-color .28s ease, box-shadow .28s ease;
    aspect-ratio: 3 / 4;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    isolation: isolate;
  }
  .game-card:hover {
    transform: translateY(-6px);
    border-color: rgba(160, 190, 255, 0.35);
    box-shadow: 0 24px 50px -20px rgba(100, 150, 255, 0.55);
  }
  /* 封面兜底（渐变 + 首字） */
  .game-card .cover-fallback {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 4.5rem; font-weight: 900;
    color: rgba(255,255,255,0.16);
    background: linear-gradient(140deg, var(--t1, #7c6eff), var(--t2, #4fb0ff));
    letter-spacing: -0.04em;
    z-index: 0;
  }
  .game-card .cover-img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    z-index: 1;
    transition: transform .45s ease;
  }
  .game-card:hover .cover-img { transform: scale(1.06); }
  .game-card .overlay {
    position: relative;
    z-index: 2;
    padding: 3rem 1.15rem 1.15rem;
    background: linear-gradient(transparent 10%, rgba(6, 8, 16, 0.55) 40%, rgba(6, 8, 16, 0.96) 100%);
  }
  .game-card .game-tag {
    display: inline-block;
    font-size: 0.6rem;
    font-weight: 700;
    padding: 0.12rem 0.55rem;
    border-radius: 20px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 0.45rem;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.14);
    color: #dce6ff;
  }
  .game-card h3 {
    font-size: 1.05rem;
    font-weight: 750;
    color: #fff;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }
  .game-card .ver {
    font-size: 0.78rem;
    color: #b0c8ff;
    margin-top: 0.15rem;
    font-weight: 500;
  }
  .game-card .ver .loading-dot {
    display: inline-block;
    width: 0.5rem; height: 0.5rem;
    border-radius: 50%;
    background: rgba(160, 190, 255, 0.6);
    margin-right: 0.3rem;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .game-card .desc {
    font-size: 0.76rem;
    color: var(--txt-dim);
    margin-top: 0.3rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .game-card .arrow {
    position: absolute;
    top: 1rem; right: 1rem;
    width: 2rem; height: 2rem;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transform: translateX(-4px);
    transition: all .25s ease;
    z-index: 3;
  }
  .game-card:hover .arrow { opacity: 1; transform: translateX(0); }
  .game-card .arrow svg { width: 14px; height: 14px; stroke: #fff; }

  /* ========== 版本列表 ========== */
  .back-bar {
    display: flex; align-items: center; gap: 0.7rem;
    margin-bottom: 1.4rem;
    flex-wrap: wrap;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.95rem 0.4rem 0.7rem;
    border-radius: 40px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: #b0c0e0;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }
  .back-btn:hover {
    background: rgba(255,255,255,0.09);
    border-color: rgba(160,190,255,0.3);
    color: #dce6ff;
  }
  .back-btn svg { width: 14px; height: 14px; stroke: currentColor; }

  .list-header {
    margin-bottom: 1.6rem;
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .list-header .list-cover {
    width: 4.5rem;
    height: 4.5rem;
    border-radius: 14px;
    overflow: hidden;
    flex-shrink: 0;
    background: linear-gradient(140deg, rgba(140,160,255,0.2), rgba(180,140,255,0.12));
    border: 1px solid rgba(255,255,255,0.06);
  }
  .list-header .list-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .list-header .list-meta { flex: 1; min-width: 0; }
  .list-header h2 {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: #eef2ff;
  }
  .list-header p {
    font-size: 0.85rem;
    color: var(--txt-dim);
    margin-top: 0.2rem;
  }

  .version-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .version-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: var(--radius-sm);
    padding: 0.95rem 1.15rem;
    cursor: pointer;
    transition: all .22s ease;
  }
  .version-item:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(150, 180, 255, 0.22);
    transform: translateX(4px);
  }
  .version-item .ver-thumb {
    width: 3.6rem;
    height: 3.6rem;
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
    background: linear-gradient(135deg, rgba(140,160,255,0.2), rgba(180,140,255,0.12));
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 800; color: #cfe0ff;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .version-item .ver-thumb img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .version-item .ver-info { flex: 1; min-width: 0; }
  .version-item .ver-title {
    font-size: 0.98rem;
    font-weight: 700;
    color: #eaf0ff;
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  }
  .version-item .ver-title .badge {
    font-size: 0.6rem;
    font-weight: 700;
    padding: 0.08rem 0.5rem;
    border-radius: 20px;
    background: rgba(255, 200, 100, 0.13);
    border: 1px solid rgba(255, 200, 100, 0.2);
    color: #ffd9a0;
    letter-spacing: 0.03em;
  }
  .version-item .ver-sub {
    font-size: 0.8rem;
    color: var(--txt-dim);
    margin-top: 0.15rem;
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  }
  .version-item .ver-sub .dot { width: 3px; height: 3px; border-radius: 50%; background: #5a6580; }
  .version-item .chevron {
    flex-shrink: 0;
    opacity: 0.35;
    transition: opacity .2s, transform .2s;
  }
  .version-item:hover .chevron { opacity: 0.8; transform: translateX(3px); }
  .version-item .chevron svg { width: 16px; height: 16px; stroke: #b0c0e0; }

  /* ========== 详情页 ========== */
  .detail-cover {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 1.6rem;
    aspect-ratio: 16 / 9;
    border: 1px solid rgba(255,255,255,0.07);
    background: linear-gradient(140deg, #1a2240, #2a1f40);
  }
  .detail-cover img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .detail-cover .cover-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(transparent 20%, rgba(6, 8, 16, 0.85) 90%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 1.5rem;
  }
  .detail-cover .cover-overlay h2 {
    font-size: 1.6rem;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.01em;
    line-height: 1.25;
  }
  .detail-cover .cover-overlay .meta {
    font-size: 0.82rem;
    color: #a8b8dc;
    margin-top: 0.3rem;
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  }

  /* 详情内容块 */
  .detail-section {
    margin-bottom: 1.6rem;
  }
  .detail-section .sec-head {
    display: flex; align-items: center; gap: 0.6rem;
    font-size: 1rem; font-weight: 700;
    color: #e0e8ff;
    margin-bottom: 0.7rem;
  }
  .detail-section .sec-head .ic {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.7rem; height: 1.7rem;
    border-radius: 9px;
    background: rgba(140,160,255,0.13);
    border: 1px solid rgba(150,175,255,0.15);
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  .info-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .info-row {
    display: flex; align-items: flex-start; gap: 0.7rem;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 14px;
    padding: 0.7rem 1rem;
    font-size: 0.9rem;
  }
  .info-row .k {
    font-weight: 600; color: #a0b8ff;
    flex-shrink: 0; min-width: 4rem;
  }
  .info-row .v { color: #cfd6e6; flex: 1; }
  .info-row .v b { color: #fff; }

  .tag-grid {
    display: flex; flex-wrap: wrap; gap: 0.5rem;
  }
  .tag-grid .tg {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.8rem;
    padding: 0.35rem 0.85rem;
    border-radius: 30px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    color: #c8d4ec;
  }
  .tag-grid .tg .n {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.1rem; height: 1.1rem; border-radius: 50%;
    font-size: 0.6rem; font-weight: 800;
    background: rgba(140,160,255,0.2);
    color: #b8ccff;
  }

  /* 角色卡 */
  .char-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 0.7rem;
  }
  .char-mini {
    display: flex; align-items: center; gap: 0.75rem;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 0.7rem 0.9rem;
    transition: all .2s;
  }
  .char-mini:hover {
    border-color: rgba(160,190,255,0.22);
    background: rgba(255,255,255,0.04);
    transform: translateY(-2px);
  }
  .char-mini .c-av {
    width: 2.8rem; height: 2.8rem; border-radius: 50%;
    overflow: hidden; flex-shrink: 0;
    background: linear-gradient(140deg, var(--c1, #a78bfa), var(--c2, #60a5fa));
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 800; color: #fff;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.06);
  }
  .char-mini .c-av img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .char-mini .c-info { min-width: 0; }
  .char-mini .c-name {
    font-size: 0.88rem; font-weight: 700; color: #fff;
    display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap;
  }
  .char-mini .c-name .stars { color: var(--gold); font-size: 0.68rem; }
  .char-mini .c-desc { font-size: 0.75rem; color: var(--txt-dim); }

  /* 兑换码 */
  .code-wrap { display: flex; flex-wrap: wrap; gap: 0.55rem; }
  .code-btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.5rem 0.9rem 0.5rem 1rem;
    border-radius: 40px;
    background: linear-gradient(135deg, rgba(120,160,255,0.15), rgba(170,130,255,0.10));
    border: 1px solid rgba(150,180,255,0.22);
    font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    font-size: 0.85rem; font-weight: 700;
    letter-spacing: 0.03em; color: #cfe0ff;
    cursor: pointer;
    transition: all .18s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    word-break: break-all;
    box-shadow: 0 4px 14px -8px rgba(110,160,255,0.8);
  }
  .code-btn:hover {
    background: linear-gradient(135deg, rgba(130,175,255,0.26), rgba(185,145,255,0.18));
    border-color: rgba(170,200,255,0.45);
    transform: translateY(-2px);
  }
  .code-btn:active { transform: translateY(0) scale(0.97); }
  .code-btn.copied {
    background: linear-gradient(135deg, rgba(80,220,160,0.2), rgba(70,200,180,0.12));
    border-color: rgba(110,240,190,0.45);
    color: #b9ffe2;
  }
  .code-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

  /* Toast */
  .toast {
    position: fixed;
    left: 50%; bottom: 2.2rem;
    transform: translateX(-50%) translateY(1.5rem);
    background: rgba(26,32,50,0.95);
    border: 1px solid rgba(130,230,190,0.3);
    color: #b6ffe4;
    padding: 0.7rem 1.4rem;
    border-radius: 40px;
    font-size: 0.85rem; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 999;
    backdrop-filter: blur(10px);
    white-space: nowrap;
    box-shadow: 0 16px 40px -12px rgba(0,0,0,0.9);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 加载 / 空状态 */
  .state-box {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--txt-dim);
    font-size: 0.9rem;
  }
  .state-box .spinner {
    width: 28px; height: 28px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top-color: #a78bfa;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto 0.8rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 底部 */
  .footer {
    text-align: center;
    padding: 2.5rem 0 1rem;
    font-size: 0.75rem;
    color: #4a5470;
  }
  .footer a { color: #6b7aa0; text-decoration: none; }
  .footer a:hover { color: #a0b8ff; }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(150,170,210,0.2); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(150,170,210,0.4); }
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="app">
  <!-- 顶部导航 -->
  <nav class="top-nav">
    <span class="logo" onclick="navigate('/')">前瞻总结</span>
    <span class="spacer"></span>
    <a class="author-chip" href="https://space.bilibili.com/26928511" target="_blank" rel="noopener">
      <img src="" alt="" id="authorAvatar" referrerpolicy="no-referrer"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <span class="avatar-fallback" style="display:none;">绳匠</span>
      <span>玩星铁的绳匠</span>
    </a>
  </nav>

  <!-- ===== 视图：首页 ===== -->
  <div class="view active" id="viewHome">
    <div class="home-hero">
      <h1>版本前瞻总结</h1>
      <p>原神 · 崩坏：星穹铁道 · 绝区零 三游前瞻一站式浏览</p>
    </div>
    <div class="game-grid" id="gameGrid">
      <!-- JS 渲染 -->
    </div>
  </div>

  <!-- ===== 视图：版本列表 ===== -->
  <div class="view" id="viewList">
    <div class="back-bar">
      <button class="back-btn" onclick="navigate('/')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        返回首页
      </button>
    </div>
    <div class="list-header" id="listHeader">
      <!-- JS 渲染 -->
    </div>
    <div class="version-list" id="versionList">
      <!-- JS 渲染 -->
    </div>
  </div>

  <!-- ===== 视图：版本详情 ===== -->
  <div class="view" id="viewDetail">
    <div class="back-bar">
      <button class="back-btn" id="detailBackBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        <span id="backLabel">返回列表</span>
      </button>
    </div>
    <div id="detailContent">
      <!-- JS 渲染 -->
    </div>
  </div>

  <div class="footer">
    <p>数据整理 · <a href="https://space.bilibili.com/26928511" target="_blank" rel="noopener">玩星铁的绳匠</a></p>
    <p style="margin-top:0.3rem; font-size:0.7rem; opacity:0.6;">内容仅供参考，以官方实际公告为准</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   配置区
   ============================================================ */
const CONFIG_URL = 'games-config.json';
const AUTHOR_MID = '26928511';
const AUTHOR_AVATAR = '';   // 手动指定头像直链，留空则自动从 B站 API 获取

/* 游戏主题色（用于封面兜底渐变） */
const GAME_THEMES = {
  genshin:  ['#7dd3fc', '#22c55e'],
  starrail: ['#8b5cf6', '#3b82f6'],
  zzz:      ['#f59e0b', '#ec4899']
};

/* ============================================================
   全局状态
   ============================================================ */
let gamesConfig = [];      // 游戏元数据（含动态填充的 latest 字段）
let routeLock = false;     // 防止路由循环

/* ============================================================
   工具函数
   ============================================================ */
const $  = (sel, root) => (root || document).querySelector(sel);

function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fallback */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta); return ok;
  } catch (e) { return false; }
}

function switchView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/* 从 games-config 里找不到的字段，尝试从 versions.json 首条取 */
function pickCover(versionItem, gameConfig) {
  if (!versionItem) return gameConfig && gameConfig.cover ? gameConfig.cover : '';
  return versionItem.cover || versionItem.banner || versionItem.thumb ||
         (gameConfig && gameConfig.cover) || '';
}

/* ============================================================
   路由：基于 hash
   #/               → 首页
   #/genshin        → 原神列表
   #/genshin/7.1    → 原神 7.1 详情
   ============================================================ */
function parseHash() {
  const hash = location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  if (parts.length === 0) return { view: 'home' };
  if (parts.length === 1) return { view: 'list', gameId: parts[0] };
  return { view: 'detail', gameId: parts[0], version: decodeURIComponent(parts[1]) };
}

function navigate(path) {
  const target = '#' + path;
  if (location.hash === target) {
    handleRoute();   // 相同 hash 也强制重新渲染一次
    return;
  }
  location.hash = path;
}

/* ============================================================
   加载配置
   ============================================================ */
async function loadConfig() {
  try {
    const res = await fetch(CONFIG_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const list = data.games || data;
    if (!Array.isArray(list) || !list.length) throw new Error('配置为空');
    gamesConfig = list;
    return true;
  } catch (e) {
    console.warn('加载 games-config.json 失败，使用内置兜底配置：', e.message);
    gamesConfig = getDefaultConfig();
    return false;
  }
}

/* 内置兜底配置（games-config.json 不存在时使用） */
function getDefaultConfig() {
  return [
    {
      id: 'genshin', name: '原神', tag: 'Genshin Impact',
      desc: '开放世界冒险RPG · 至冬篇进行中',
      folder: 'yuanshen'
    },
    {
      id: 'starrail', name: '崩坏：星穹铁道', tag: 'Honkai: Star Rail',
      desc: '银河冒险策略RPG · 二相乐园篇',
      folder: 'starRail'
    },
    {
      id: 'zzz', name: '绝区零', tag: 'Zenless Zone Zero',
      desc: '都市动作冒险RPG · 新艾利都',
      folder: 'zzz'
    }
  ];
}

/* 加载单个游戏的 versions.json */
async function fetchVersionsFor(game) {
  const folder = game.folder || game.id;
  const url = `${folder}/versions.json?t=${Date.now()}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    let versions = Array.isArray(data) ? data : (data.versions || []);
    versions.sort((a, b) => (b.publishDate || '').localeCompare(a.publishDate || ''));
    return { game, versions, latest: versions[0] || null, error: null };
  } catch (e) {
    return { game, versions: [], latest: null, error: e.message };
  }
}

/* ============================================================
   作者头像
   ============================================================ */
async function loadAuthorAvatar() {
  const img = $('#authorAvatar');
  const fallback = img.nextElementSibling;

  if (AUTHOR_AVATAR) {
    img.src = AUTHOR_AVATAR;
    img.style.display = 'block';
    fallback.style.display = 'none';
    return;
  }

  try {
    const res = await fetch(
      `https://api.bilibili.com/x/web-interface/card?mid=${AUTHOR_MID}`,
      { referrerPolicy: 'no-referrer' }
    );
    const data = await res.json();
    if (data && data.code === 0 && data.data && data.data.card && data.data.card.face) {
      img.src = data.data.card.face;
      img.style.display = 'block';
      fallback.style.display = 'none';
      return;
    }
  } catch (e) { /* 静默失败 */ }

  img.style.display = 'none';
  fallback.style.display = 'flex';
}

/* ============================================================
   首页渲染
   ============================================================ */
async function renderHome() {
  const grid = $('#gameGrid');
  grid.innerHTML = '<div class="state-box"><div class="spinner"></div>加载游戏数据…</div>';

  // 并行拉取所有游戏的 versions.json
  const results = await Promise.allSettled(gamesConfig.map(fetchVersionsFor));

  // 把 latest 挂到 gamesConfig 上，后续列表页可复用
  results.forEach((r, i) => {
    if (r.status === 'fulfilled') {
      gamesConfig[i]._versions = r.value.versions;
      gamesConfig[i]._latest   = r.value.latest;
      gamesConfig[i]._error    = r.value.error;
    } else {
      gamesConfig[i]._versions = [];
      gamesConfig[i]._latest   = null;
      gamesConfig[i]._error    = '加载失败';
    }
  });

  grid.innerHTML = gamesConfig.map(g => {
    const latest = g._latest;
    const theme  = GAME_THEMES[g.id] || ['#7c6eff', '#4fb0ff'];
    const cover  = pickCover(latest, g);
    const verText = latest
      ? `当前版本 ${escapeHtml(latest.version)}${latest.title ? ' 「' + escapeHtml(latest.title) + '」' : ''}`
      : (g._error ? '版本数据加载失败' : '暂无版本数据');
    const firstChar = (g.name || '?').slice(0, 1);

    return `
      <div class="game-card" style="--t1:${theme[0]};--t2:${theme[1]};"
           onclick="navigate('/${encodeURIComponent(g.id)}')">
        <div class="cover-fallback">${escapeHtml(firstChar)}</div>
        ${cover ? `<img class="cover-img" src="${escapeHtml(cover)}" alt="${escapeHtml(g.name)}封面"
                      loading="lazy" referrerpolicy="no-referrer"
                      onerror="this.style.display='none'">` : ''}
        <div class="arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <div class="overlay">
          <span class="game-tag">${escapeHtml(g.tag || '')}</span>
          <h3>${escapeHtml(g.name)}</h3>
          <div class="ver">${escapeHtml(verText)}</div>
          <div class="desc">${escapeHtml(g.desc || '')}</div>
        </div>
      </div>`;
  }).join('');
}

/* ============================================================
   版本列表视图
   ============================================================ */
async function renderListView(gameId) {
  const game = gamesConfig.find(g => g.id === gameId);
  if (!game) {
    navigate('/');
    return;
  }

  // 如果首页已经加载过，直接复用
  let versions = game._versions;
  if (!versions) {
    const r = await fetchVersionsFor(game);
    versions = r.versions;
    game._versions = versions;
    game._latest = r.latest;
  }

  const header = $('#listHeader');
  const theme  = GAME_THEMES[game.id] || ['#7c6eff', '#4fb0ff'];
  const latest = game._latest;
  const cover  = pickCover(latest, game);
  const firstChar = (game.name || '?').slice(0, 1);

  header.innerHTML = `
    <div class="list-cover" style="background:linear-gradient(140deg,${theme[0]},${theme[1]})">
      ${cover ? `<img src="${escapeHtml(cover)}" alt="" referrerpolicy="no-referrer"
                    onerror="this.style.display='none';this.parentElement.innerHTML='${escapeHtml(firstChar)}'">`
              : `<span style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;color:rgba(255,255,255,0.7);">${escapeHtml(firstChar)}</span>`}
    </div>
    <div class="list-meta">
      <h2>${escapeHtml(game.name)} · 版本前瞻</h2>
      <p>${escapeHtml(game.desc || '')}</p>
    </div>`;

  const listEl = $('#versionList');

  if (!versions || !versions.length) {
    listEl.innerHTML = `
      <div class="state-box">
        <p style="font-size:1.5rem;margin-bottom:0.5rem;">📂</p>
        <p>未找到 <b>${escapeHtml(game.folder || game.id)}/versions.json</b></p>
        <p style="margin-top:0.4rem;font-size:0.78rem;opacity:0.6;">请在该文件夹下创建版本索引文件</p>
      </div>`;
    return;
  }

  listEl.innerHTML = versions.map((v, i) => {
    const isLatest = i === 0;
    const thumb = v.thumb || v.cover || v.banner || '';
    const verShort = (v.version || '').slice(0, 6);
    return `
      <div class="version-item" onclick="navigate('/${encodeURIComponent(game.id)}/${encodeURIComponent(v.version || '')}')">
        <div class="ver-thumb">
          ${thumb
            ? `<img src="${escapeHtml(thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer"
                    onerror="this.style.display='none';this.parentElement.textContent='${escapeHtml(verShort)}'">`
            : escapeHtml(verShort)}
        </div>
        <div class="ver-info">
          <div class="ver-title">
            ${escapeHtml(v.version || '')} 「${escapeHtml(v.title || '')}」
            ${isLatest ? '<span class="badge">最新</span>' : ''}
          </div>
          <div class="ver-sub">
            <span>${escapeHtml(v.publishDate || '')}</span>
            ${v.brief ? `<span class="dot"></span><span>${escapeHtml(v.brief)}</span>` : ''}
          </div>
        </div>
        <div class="chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>`;
  }).join('');
}

/* ============================================================
   详情视图
   ============================================================ */
async function renderDetailView(gameId, versionStr) {
  const game = gamesConfig.find(g => g.id === gameId);
  if (!game) { navigate('/'); return; }

  // 确保有版本列表
  let versions = game._versions;
  if (!versions) {
    const r = await fetchVersionsFor(game);
    versions = r.versions;
    game._versions = versions;
    game._latest = r.latest;
  }

  const meta = versions.find(v => String(v.version) === String(versionStr));
  if (!meta) {
    // 版本不存在 → 回到列表页
    navigate('/' + encodeURIComponent(gameId));
    return;
  }

  // 更新返回按钮
  $('#backLabel').textContent = '返回' + game.name + '列表';
  $('#detailBackBtn').onclick = () => navigate('/' + encodeURIComponent(gameId));

  const container = $('#detailContent');
  container.innerHTML = '<div class="state-box"><div class="spinner"></div>加载详情…</div>';

  try {
    const folder = game.folder || game.id;
    const file = meta.file || (meta.version + '.json');
    const url = folder + '/' + file + '?t=' + Date.now();
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const detail = await res.json();
    renderDetailContent(detail, game, meta);
  } catch (e) {
    container.innerHTML = `
      <div class="state-box">
        <p style="font-size:1.5rem;margin-bottom:0.5rem;">⚠️</p>
        <p>未找到详情文件 <b>${escapeHtml(meta.file || (meta.version + '.json'))}</b></p>
        <p style="margin-top:0.4rem;font-size:0.78rem;opacity:0.6;">请检查 ${escapeHtml(game.folder || game.id)}/ 目录</p>
      </div>`;
  }
}

/* ============================================================
   详情内容渲染
   ============================================================ */
function renderDetailContent(d, game, meta) {
  const container = $('#detailContent');
  const theme = GAME_THEMES[game.id] || ['#7c6eff', '#4fb0ff'];
  const banner = d.banner || d.cover || meta.cover || meta.banner || meta.thumb || '';
  const v = d.version || meta.version || '';
  const title = d.title || meta.title || '';
  const date = d.publishDate || meta.publishDate || '';
  const brief = d.brief || meta.brief || '';

  let html = '';

  /* --- 封面 --- */
  if (banner) {
    html += `
      <div class="detail-cover" style="background:linear-gradient(140deg,${theme[0]},${theme[1]})">
        <img src="${escapeHtml(banner)}" alt="${escapeHtml(v + ' ' + title)}" loading="lazy"
             referrerpolicy="no-referrer" onerror="this.style.display='none'">
        <div class="cover-overlay">
          <h2>${escapeHtml(v)}「${escapeHtml(title)}」</h2>
          <div class="meta">
            <span>${escapeHtml(date)}</span>
            ${brief ? `<span>·</span><span>${escapeHtml(brief)}</span>` : ''}
          </div>
        </div>
      </div>`;
  }

  /* --- 兑换码 --- */
  if (d.codes && d.codes.length) {
    html += `<div class="detail-section">
      <div class="sec-head"><span class="ic">🎁</span>兑换码</div>
      <div class="code-wrap">`;
    d.codes.forEach(cd => {
      const label = cd.code || cd;
      const server = cd.server ? `【${cd.server}】` : '';
      html += `<button class="code-btn" data-code="${escapeHtml(label)}" title="点击复制">
        <span>${escapeHtml(server + label)}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>`;
    });
    html += `</div></div>`;
  }

  /* --- 卡池 --- */
  if (d.banners && d.banners.length) {
    html += `<div class="detail-section">
      <div class="sec-head"><span class="ic">🎴</span>卡池</div>
      <div class="info-list">`;
    d.banners.forEach(b => {
      html += `<div class="info-row">
        <span class="k">${escapeHtml(b.phase || '')}</span>
        <span class="v">${b.detail || ''}</span>
      </div>`;
    });
    html += `</div></div>`;
  }

  /* --- 新角色 --- */
  if (d.characters && d.characters.length) {
    html += `<div class="detail-section">
      <div class="sec-head"><span class="ic">👤</span>新角色</div>
      <div class="char-grid">`;
    d.characters.forEach(ch => {
      const c1 = ch.color1 || '#a78bfa';
      const c2 = ch.color2 || '#60a5fa';
      const firstChar = (ch.element || ch.name || '?').slice(0, 1);
      html += `<div class="char-mini">
        <div class="c-av" style="--c1:${escapeHtml(c1)};--c2:${escapeHtml(c2)}">
          ${ch.avatar
            ? `<img src="${escapeHtml(ch.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer"
                    onerror="this.style.display='none';this.parentElement.textContent='${escapeHtml(firstChar)}'">`
            : escapeHtml(firstChar)}
        </div>
        <div class="c-info">
          <div class="c-name">${escapeHtml(ch.name)} <span class="stars">${'★'.repeat(ch.rarity || 5)}</span></div>
          <div class="c-desc">${escapeHtml(ch.element || '')}${ch.desc ? ' · ' + escapeHtml(ch.desc) : ''}</div>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  }

  /* --- 通用字段 --- */
  const sections = [
    { key: 'weapons',      icon: '⚔️',  title: '新武器'   },
    { key: 'story',        icon: '📖',  title: '新剧情'   },
    { key: 'quests',       icon: '📜',  title: '新任务'   },
    { key: 'activities',   icon: '🎮',  title: '新活动'   },
    { key: 'monsters',     icon: '👹',  title: '新怪物'   },
    { key: 'gameplay',     icon: '🧩',  title: '新玩法'   },
    { key: 'appearance',   icon: '👗',  title: '新外观'   },
    { key: 'optimization', icon: '⚙️',  title: '优化更新' },
    { key: 'collab',       icon: '🤝',  title: '联动资讯' },
    { key: 'welfare',      icon: '🎉',  title: '福利汇总' },
    { key: 'otherUpdates', icon: '✨',  title: '其他更新' }
  ];

  sections.forEach(sec => {
    const val = d[sec.key];
    if (!val || (Array.isArray(val) && !val.length)) return;

    html += `<div class="detail-section">
      <div class="sec-head"><span class="ic">${sec.icon}</span>${sec.title}</div>`;

    if (Array.isArray(val)) {
      if (typeof val[0] === 'string') {
        html += '<div class="tag-grid">';
        val.forEach((item, i) => {
          html += `<span class="tg"><span class="n">${i + 1}</span>${escapeHtml(item)}</span>`;
        });
        html += '</div>';
      } else {
        html += '<div class="info-list">';
        val.forEach(item => {
          const k  = item.label || item.k || '';
          const v2 = item.value || item.v || item.detail || '';
          html += `<div class="info-row">
            ${k ? `<span class="k">${escapeHtml(k)}</span>` : ''}
            <span class="v">${v2}</span>
          </div>`;
        });
        html += '</div>';
      }
    } else if (typeof val === 'string') {
      html += `<div class="info-row"><span class="v">${escapeHtml(val)}</span></div>`;
    }

    html += `</div>`;
  });

  /* --- 有效期 --- */
  if (d.expiry) {
    html += `<div class="detail-section">
      <div class="info-row" style="background:linear-gradient(120deg,rgba(255,180,90,0.08),rgba(255,120,140,0.04));border-color:rgba(255,195,110,0.16);">
        <span class="v" style="color:#f2dcb4;">⏳ 兑换码有效期至 ${escapeHtml(d.expiry)}</span>
      </div>
    </div>`;
  }

  container.innerHTML = html;

  /* 绑定兑换码复制 */
  container.querySelectorAll('.code-btn').forEach(btn => {
    btn.addEventListener('click', async function () {
      const code = this.dataset.code;
      const ok = await copyText(code);
      if (ok) {
        showToast('✅ 已复制：' + code);
        this.classList.add('copied');
        const ic = this.querySelector('svg');
        const orig = ic ? ic.outerHTML : '';
        if (ic) ic.outerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        setTimeout(() => {
          this.classList.remove('copied');
          if (ic && orig) this.querySelector('svg').outerHTML = orig;
        }, 1500);
      } else {
        showToast('❌ 复制失败，请手动长按选择');
      }
    });
  });
}

/* ============================================================
   路由处理
   ============================================================ */
async function handleRoute() {
  if (routeLock) return;
  routeLock = true;
  try {
    const route = parseHash();

    if (route.view === 'home') {
      switchView('viewHome');
      // 首页每次回到都重新拉取（保证版本号最新）
      await renderHome();
    } else if (route.view === 'list') {
      switchView('viewList');
      await renderListView(route.gameId);
    } else if (route.view === 'detail') {
      switchView('viewDetail');
      await renderDetailView(route.gameId, route.version);
    }
  } finally {
    routeLock = false;
  }
}

/* ============================================================
   初始化
   ============================================================ */
async function init() {
  loadAuthorAvatar();
  await loadConfig();
  window.addEventListener('hashchange', handleRoute);
  await handleRoute();
}

init();
</script>
