name: Auto Fetch Game Data

on:
  schedule:
    # 每天 UTC 03:00（北京时间 11:00）运行
    - cron: '0 3 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许推送

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch version data
        run: node scripts/fetch-version.js

      - name: Fetch redeem codes
        run: node scripts/fetch-codes.js
        continue-on-error: true   # 兑换码获取失败不阻塞流程

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "chore: auto-update game data [skip ci]" && git push)